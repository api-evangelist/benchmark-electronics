note: >-
  Benchmark Electronics publishes a Policies and Regulatory Disclosures page linking a
  Cybersecurity Statement, an Information Security Management Policy, a Code of Conduct,
  Conflict Minerals, Human Rights and Sustainability policies and Romanian CbCR filings, plus a
  Certifications and Registrations page naming site-level ISO 9001/13485/14001/45001, AS9100,
  IATF 16949, TL 9000, Nadcap, MedAccred, FDA/QMSR and ITAR registrations. Of the fourteen
  horizontal signals this artifact records, two are published with substance: a Global Privacy
  Control statement and a data-subject-request channel, both inside the Privacy Policy. The
  Cybersecurity Statement names DFARS/NIST 800-171 and CMMC alignment and formal incident
  response protocols but states no notification SLA, so incident_notification is not recorded.
  No accessibility conformance report, subprocessor list, DPA, SBOM, AI transparency, data
  residency, support-lifetime, age-assurance, notice-and-action, transparency-report or
  exit-assistance page exists; every conventional path below returned a real 404. There is no
  developer documentation site to search.
