  data_subject_request:
    url: https://www.bench.com/privacy-policy
    contact: privacy@bench.com
    note: >-
      "Exercising Your Rights" section: requests to know, access, delete and opt out are
      submitted by email to privacy@bench.com; California requests are acknowledged within 10
